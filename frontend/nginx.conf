server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /v1/ { proxy_pass http://api:8090; proxy_read_timeout 30s; }
    location = /health { proxy_pass http://api:8090; }
    location = /ready { proxy_pass http://api:8090; }
    location = /metrics { proxy_pass http://api:8090; }
    location = /docs { proxy_pass http://api:8090; }
    location = /openapi.json { proxy_pass http://api:8090; }
    location / { try_files $uri $uri/ /index.html; }
}
